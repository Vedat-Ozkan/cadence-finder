name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v6
      - uses: astral-sh/setup-uv@v10
      - name: Build
        run: ./gradlew build :ingest-worker:bootJar :search-api:bootJar
      - name: Fetch corpus
        run: scripts/fetch-corpus.sh
      - name: Start stack
        env:
          LOCALSTACK_AUTH_TOKEN: ${{ secrets.LOCALSTACK_AUTH_TOKEN }}
        run: docker compose -f e2e/compose.yaml up -d --build --wait
      - name: End-to-end tests
        run: uv run --project e2e pytest e2e -q
      - name: Service logs
        if: failure()
        env:
          LOCALSTACK_AUTH_TOKEN: unused
        run: docker compose -f e2e/compose.yaml logs --no-color ingest-worker search-api
