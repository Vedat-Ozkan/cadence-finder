name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      natural_language:
        description: Also run the natural-language tests (calls the Claude API)
        type: boolean
        default: false

jobs:
  build-and-e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v6
      - uses: astral-sh/setup-uv@v10.3.2
      - name: Build
        run: ./gradlew build :ingest-worker:bootJar :search-api:bootJar
      - name: Fetch corpus
        run: scripts/fetch-corpus.sh
      - name: Start stack
        env:
          LOCALSTACK_AUTH_TOKEN: ${{ secrets.LOCALSTACK_AUTH_TOKEN }}
          VOYAGE_API_KEY: ${{ secrets.VOYAGE_API_KEY }}
          ANTHROPIC_API_KEY: ${{ inputs.natural_language && secrets.ANTHROPIC_API_KEY || '' }}
        run: docker compose -f e2e/compose.yaml up -d --build --wait
      - name: End-to-end tests
        env:
          RUN_NL: ${{ inputs.natural_language && '1' || '0' }}
        run: uv run --project e2e pytest e2e -q
      - name: Service logs
        if: failure()
        env:
          LOCALSTACK_AUTH_TOKEN: unused
          VOYAGE_API_KEY: unused
        run: docker compose -f e2e/compose.yaml logs --no-color ingest-worker search-api embedder
