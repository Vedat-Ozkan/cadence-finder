name: images

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: [ingest-worker, search-api]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew :${{ matrix.service }}:bootJar
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.service }}
          platforms: linux/amd64,linux/arm64
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: |
            ghcr.io/vedat-ozkan/cadence-finder/${{ matrix.service }}:${{ github.sha }}
            ghcr.io/vedat-ozkan/cadence-finder/${{ matrix.service }}:main

  embedder:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: embedder
          platforms: linux/${{ matrix.arch }}
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: ghcr.io/vedat-ozkan/cadence-finder/embedder:${{ github.sha }}-${{ matrix.arch }}

  embedder-manifest:
    needs: embedder
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      packages: write
    steps:
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: |
          image=ghcr.io/vedat-ozkan/cadence-finder/embedder
          docker buildx imagetools create -t "$image:${{ github.sha }}" -t "$image:main" "$image:${{ github.sha }}-amd64" "$image:${{ github.sha }}-arm64"
