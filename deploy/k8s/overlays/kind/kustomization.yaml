apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
  - https://github.com/kubernetes-sigs/metrics-server/releases/download/v0.9.0/components.yaml
  - localstack.yaml
patches:
  - target:
      kind: Deployment
      name: metrics-server
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/args/-
        value: --kubelet-insecure-tls
configMapGenerator:
  - name: cadence-config
    namespace: cadence
    literals:
      - AWS_REGION=us-east-1
      - CADENCE_ENV=dev
      - SPRING_CLOUD_AWS_ENDPOINT=http://localstack:4566
      - SPRING_CLOUD_AWS_CREDENTIALS_ACCESS_KEY=test
      - SPRING_CLOUD_AWS_CREDENTIALS_SECRET_KEY=test
      - SPRING_CLOUD_AWS_S3_PATH_STYLE_ACCESS_ENABLED=true
      - CADENCE_BUCKET=cadence-e2e
      - CADENCE_TABLE=cadence-e2e
      - CADENCE_QUEUE=ingest-e2e
      - EMBEDDER_URL=http://embedder:8000
      - VOYAGE_MODEL=voyage-4-lite
  - name: localstack-init
    namespace: cadence
    files:
      - init.sh=localstack-init.sh
  - name: otel-collector
    namespace: cadence
    behavior: replace
    files:
      - config.yaml=otel-collector-config.yaml
images:
  - name: ghcr.io/vedat-ozkan/cadence-finder/ingest-worker
    newName: cadence/ingest-worker
    newTag: dev
  - name: ghcr.io/vedat-ozkan/cadence-finder/search-api
    newName: cadence/search-api
    newTag: dev
  - name: ghcr.io/vedat-ozkan/cadence-finder/embedder
    newName: cadence/embedder
    newTag: dev
