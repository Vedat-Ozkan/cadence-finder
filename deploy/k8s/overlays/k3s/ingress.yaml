apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: search-api
  namespace: cadence
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/router.tls.certresolver: letsencrypt
spec:
  rules:
    - host: cadence-finder.duckdns.org
      http:
        paths:
          - path: /search
            pathType: Prefix
            backend:
              service:
                name: search-api
                port:
                  name: http
          - path: /passages
            pathType: Prefix
            backend:
              service:
                name: search-api
                port:
                  name: http
          - path: /nl-search
            pathType: Prefix
            backend:
              service:
                name: search-api
                port:
                  name: http
