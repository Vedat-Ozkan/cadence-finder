apiVersion: apps/v1
kind: Deployment
metadata:
  name: ingest-worker
  labels:
    app: ingest-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ingest-worker
  template:
    metadata:
      labels:
        app: ingest-worker
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
        - name: ingest-worker
          image: ghcr.io/vedat-ozkan/cadence-finder/ingest-worker
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: cadence-config
            - secretRef:
                name: aws-credentials
                optional: true
          env:
            - name: JAVA_TOOL_OPTIONS
              value: -Xmx224m -XX:ActiveProcessorCount=2
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 2
            failureThreshold: 60
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
